name: Timezone Sanitize (OPSEC)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize:
    name: No timezone tokens in public tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan for timezone leakage
        run: bash scripts/sanitize-timezones.sh
