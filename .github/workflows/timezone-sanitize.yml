name: Timezone Sanitize (OPSEC)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize:
    name: No timezone tokens in public tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for timezone leakage
        run: bash scripts/sanitize-timezones.sh
